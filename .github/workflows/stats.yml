name: Refresh telemetry

on:
  schedule:
    - cron: "17 18 * * *" # 03:17 JST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render assets/stats.svg
        env:
          # Optional: add a classic PAT named GH_STATS_TOKEN (scope: read:user, repo)
          # to count private contributions. Falls back to the default token.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "telemetry unchanged"
          else
            git commit -m "chore: refresh telemetry"
            git push
          fi
